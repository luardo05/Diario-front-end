<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E5A1AA" />
    <link rel="manifest" href="manifest.json">
    <title>Registrar Evento - Diário Pessoal</title>

    <script src="js/authGuard.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="main-header">
        <h1>Registrar um Dia</h1>
        <a href="diary.html" class="btn btn-secondary">Voltar ao Diário</a>
    </header>

    <main class="container">

        <form id="event-form" class="event-form" enctype="multipart/form-data">

            <div class="form-group">
                <label for="title">Título do Dia</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="date">Data</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>
                <textarea id="description" name="description" rows="6" required></textarea>
            </div>

            <div class="form-group">
                <label for="photo">Foto Principal do Dia</label>
            
                <input type="file" id="photo" name="photo" accept="image/*">
                
            </div>

            <button type="submit" class="btn">Salvar Registro</button>

        </form>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/eventForm.js"></script>

</body>

</html>
